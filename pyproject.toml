[project]
name = "pokemon"
version = "0.1.0"
description = "Pokemon PPT helper tool - scrape Pokemon info from wiki.52poke.com"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "jinja2>=3.1.0",
    "lxml>=5.0.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
]
